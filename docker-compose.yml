services:
  veloura-api:
    container_name: veloura-api
    restart: always
    image: node:20.10.0
    ports: 
      - 4001:3007
    volumes:
      - ./:/usr/src/veloura
    working_dir: /usr/src/veloura

    networks:
      - monorepo-network


    #FOR PRODUCTION
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"
  veloura-batch:
    container_name: veloura-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/veloura
    working_dir: /usr/src/veloura
    networks:
      - monorepo-network
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
